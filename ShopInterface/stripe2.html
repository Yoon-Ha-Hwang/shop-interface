<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Payment in Progress...</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h2 class="font">Payment</h2>
  <small class="font">(You do not actually pay anything, this is a mock transaction page; so you can type whatever information you want even if it's fake)</small>
  <div class="stripe">
    <p class="font">Your remaining bill is </p>
    <p class="font" id="remainingPrice"></p>
    <p class="font">Choose a currency to pay in: </p>
    <select class="font" id="dropdown">
      <option value=0>Singapore Dollar</option>
      <option value=1 selected> U.S. Dollar</option>
      <option value=2>Canadian Dollar</option>
      <option value=3>Euro</option>
      <option value=4>British Pound</option>
      <option value=5>Australian Dollar</option>
      <option value=6>Malaysian Ringgit</option>
      <option value=7>Indonesian Rupiah</option>
      <option value=8>Thai Baht</option>
      <option value=9>Vietnamese Dong</option>
      <option value=10>Indian Rupee</option>
      <option value=11>Hong Kong Dollar</option>
      <option value=12>Chinese Yuan</option>
      <option value=13>South Korean Won</option>
      <option value=14>Japanese Yen</option>
      <option value=15>Russian Ruble</option>
      <option value=16>Romanian Leu</option>
      <option value=17>Polish Zloty</option>
    </select>
    <br><br>
    <div class="font" id="FXInfo"></div>
    <div class="font" id="toPay"></div>

    <br>
    <p class="font"><strong>Please enter your payment details</strong></p>
    <br>
    <input type="text" class="textfield" id="name" placeholder="Your Name">
    <br>
    <input type="number" class="textfield" id="cardnumber" placeholder="Card Number">
    <br>
    <input type="text" class="textfield" id="cardexpiry" placeholder="Expiry Date">
    <br>
    <input type="number" class="textfield" id="cardcvv" placeholder="CVV">
    <br>
    <textarea class="textfield" id="billingAddress" placeholder="Billing Address"></textarea>
    <br>
    <input type="text" class="textfield" id="email" placeholder="Email">
  </div>

  <div class="paymentinfo">
    <button class="buttondesign" onclick="goBack()">Cancel Payment</button>
    <button class="buttondesign" onclick="check()">Confirm Payment Info</button>
  </div>

  <script src="script.js"></script>

  <script>
    //Start of AI-enhanced code block
    const remainingPrice = Number(sessionStorage.getItem("remainingPrice")); //Retrieve saved value from stripe.html
    const remainingPriceElement = document.getElementById("remainingPrice");
    const dropdown = document.getElementById("dropdown");
    remainingPriceElement.innerHTML = '<img src="Custom Currency Icon.png" alt="$" width="12" height="19.2">' + remainingPrice;
    //End of AI-enhanced code block


    //IMPORTANT: MAKE SURE THE ARRAY MATCHES THE DROPDOWN OPTIONS 
    function updateMessage() {
      const currencyList = ["SGD", "USD", "CAD", "EUR", "GBP", "AUD", "MYR", "IDR", "THB", "VND", "INR", "HKD", "CNY", "KRW", "JPY", "RUB", "RON", "PLN"]; 
      const exchangeRate = [1.00, 0.80, 1.05, 0.65, 0.55, 1.15, 3.10, 14500, 25, 19000, 80, 5.70, 5.30, 1200, 150, 130, 2.00, 2.50];
      //Editor's Note: These aren't actual values; they are only loosely based on the actual values. After all, this isn't a real-life storefront.
      const selectedIndex = Number(dropdown.value);
      const selectedCurrency = currencyList[selectedIndex];

      let appliedRate = exchangeRate[selectedIndex];
      let totalDue = appliedRate * remainingPrice;
      let FXInfo = document.getElementById("FXInfo");
      let toPay = document.getElementById("toPay");

      if(String(exchangeRate[selectedIndex]).indexOf(".") == -1) {
        FXInfo.innerHTML = "Exchange rate: " + '<img src="Custom Currency Icon.png" alt="$" width="12" height="19.2">' + "1 = " + selectedCurrency + " " + appliedRate;
        toPay.innerHTML = "You will pay: " + selectedCurrency + " " + totalDue;
      } else {
        FXInfo.innerHTML = "Exchange rate: " + '<img src="Custom Currency Icon.png" alt="$" width="12" height="19.2">' + "1 = " + selectedCurrency + " " + appliedRate.toFixed(2);
        toPay.innerHTML = "You will pay: " + selectedCurrency + " " + totalDue.toFixed(2);
      }
    }

    //Start of AI-enhanced code block
    dropdown.addEventListener("change", () => {
      updateMessage();
    });

    updateMessage();
    //End of AI-enhanced code block

    function check() {
      let nameEntered = document.getElementById("name").value;
      let cardEntered = document.getElementById("cardnumber").value;
      let expiryEntered = document.getElementById("cardexpiry").value;
      let cvvEntered = document.getElementById("cardcvv").value;
      let addressEntered = document.getElementById("billingAddress").value;
      let emailEntered = document.getElementById("email").value;
      if(nameEntered.trim() === "") {
        alert("Please enter your name.");
      } else if(cardEntered.trim() === "") {
        alert("Please enter your card number.");
      } else if(expiryEntered.trim() === "") {
        alert("Please enter your card's expiry date.");
      } else if(cvvEntered.trim() === "") {
        alert("Please enter your card's CVV value.");
      } else if(addressEntered.trim() === "") {
        alert("Please enter your billing address.");
      } else if(emailEntered.trim() === "") {
        alert("Please enter your email address.");
      } else {
        alert("Payment Success!");
        window.location.href = "success.html";
      }
    }
  </script>
</body>
